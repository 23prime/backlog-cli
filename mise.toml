# ================================================================
# Settings
# ================================================================
[settings]
auto_install = false
minimum_release_age = "3d"


# ================================================================
# Tools
# ================================================================
[tools]

# Node.js
node = "26"

# pnpm (docs)
pnpm = "11"

# Markdown
markdownlint-cli2 = "0.23.2"

# GitHub Actions
actionlint = "1"
shellcheck = "0.11"
zizmor = "1.29.0"

# Git
lefthook = "2.1.10"
betterleaks = "v1.8.1"

# Spell Check
cspell = "10"


# ================================================================
# Tasks
# See: https://mise.jdx.dev/tasks/toml-tasks.html
# ================================================================

# Global
[tasks.setup]
description = "Setup tools"
env = { GITHUB_TOKEN = "{{ exec(command='gh auth token') }}" }
run = [
  "mise trust -yq",
  "mise install",
  "lefthook install",
  "cargo install cargo-edit",
]
alias = "s"

[tasks.fix]
description = "Fix all issues"
depends = ["md-fix", "gh-fix", "rs-fix"]
alias = "f"

[tasks.check]
description = "Check for all issues"
depends = [
  "md-check",
  "gh-check",
  "spell-check",
  "secret-check-all",
  "rs-check",
]
alias = "c"

[tasks.fix-and-check]
run = [{ task = "fix" }, { task = "check" }]
description = "Fix all issues and check for issues"
alias = "fc"

# Markdown
[tasks.md-fix]
description = "Fix Markdown issues"
run = "markdownlint-cli2 '**/*.md' --fix"
alias = "mf"

[tasks.md-check]
description = "Check for Markdown issues"
run = "markdownlint-cli2 '**/*.md'"
alias = "mc"

# GitHub Actions
[tasks.gh-fix]
description = "Fix GitHub Actions workflows"
run = "zizmor --fix=all ."
alias = "ghf"

[tasks.gh-check]
description = "Check GitHub Actions workflows"
run = [
  "actionlint .github/workflows/*.yml",
  "zizmor . --persona=pedantic --min-severity=low",
]
alias = "ghc"

# Spell Check
[tasks.spell-check]
description = "Check spelling"
run = "cspell . --gitignore --verbose"
alias = "sc"

# Secrets
[tasks.secret-check]
description = "Check staged files for leaked secrets"
run = "betterleaks git --pre-commit --redact --no-banner"
alias = "scc"

[tasks.secret-check-all]
description = "Check for leaked secrets"
run = "betterleaks git --redact --no-banner"
alias = "sca"

# Rust
[tasks.rs-install]
description = "Install Rust dependencies"
run = "cargo fetch"

[tasks.rs-fix]
description = "Fix Rust code"
run = [
  "cargo clippy --all-targets --all-features --no-deps --fix --allow-dirty -- -D warnings",
  "cargo fmt",
]
alias = "rf"

[tasks.rs-check]
description = "Check Rust code"
run = [{ task = "rs-lint" }, { task = "rs-test" }]
alias = "rc"

[tasks.rs-lint]
description = "Lint Rust code"
run = [
  "cargo clippy --all-targets --all-features --no-deps -- -D warnings",
  "cargo fmt -- --check",
]
alias = "rl"

[tasks.rs-test]
description = "Run Rust tests"
run = ["cargo test -- --nocapture"]
alias = "rt"

[tasks.rs-run]
description = "Run Rust application"
run = "cargo run"
alias = "rr"

[tasks.rs-build]
description = "Build Rust application"
run = "cargo build"

[tasks.rs-build-release]
description = "Build Rust application in release mode"
run = "cargo build --release"

[tasks.rs-clean]
description = "Clean Rust build artifacts"
run = "cargo clean"

# Docs
[tasks.docs-install]
description = "Install docs dependencies"
run = "pnpm install --frozen-lockfile"
dir = "website"

[tasks.docs-serve]
description = "Build and serve docs locally (all locales)"
run = ["pnpm build", "pnpm serve"]
dir = "website"
alias = "ds"

[tasks.docs-build]
description = "Build docs static site"
run = "pnpm build"
dir = "website"

# mise lock
[tasks.lock-fix]
description = "Update mise.lock"
run = "mise lock"
alias = "lf"

[tasks.lock-check]
description = "Check mise.lock is up to date"
run = ["mise lock", "git diff --exit-code -- mise.lock"]
alias = "lc"
