name: Check Markdown

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/check-markdown.yml"
      - ".markdownlint-cli2.jsonc"
      - "mise.lock"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/check-markdown.yml"
      - ".markdownlint-cli2.jsonc"
      - "mise.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push auto-fix commits
    steps:
      - name: cicd-sensor
        uses: cicd-sensor/cicd-sensor-action@a803a7bc1890f85d3f2feb7c29b74b5c730da6c2 # v0.0.37

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request checks out a shallow merge commit by default, and its parents are missing
          # locally, so pushing the auto-fix commit to the PR branch is rejected as non-fast-forward.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install mise and setup
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          install_args: "markdownlint-cli2"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_LOCKED: "1"

      - name: Fix
        run: mise run md-fix

      - name: Commit and Push
        uses: 23prime/simple-commit-and-push@15fb653b9591afde3bffb82a906a9af2aede1616 # v1.0.0
        with:
          commit-message: "Auto fix by workflow"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check
        run: mise run md-check
