[package]
name = "bl"
version = "0.7.3"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["okkey"]

[[bin]]
name = "bl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rpassword = "7"
keyring-core = "1"
anstream = "1.0"
owo-colors = "4"
open = "5"
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
httpmock = { version = "0.8", default-features = false }
tempfile = "3"
